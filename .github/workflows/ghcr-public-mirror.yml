name: GHCR Public Mirror

# 公开仓侧的镜像归属：GitHub 仓库侧栏只列「由该仓库发布」的包。
# 镜像本体由私有仓构建推送，这里派生出新 digest 再推，使其登记为公开仓的发布。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签（如 12.1.1）'
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-public-mirror-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/spartawhy117/jvedionext

jobs:
  mirror:
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          raw="${INPUT_TAG:-$RELEASE_TAG}"
          tag="${raw#v}"
          if ! printf '%s' "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Unsupported tag '$raw'"
            exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image with mirror label
        run: |
          set -euo pipefail
          # 直接复推同一 digest 不会被登记为「本仓发布」；派生一层改变 digest。
          printf 'FROM %s:%s\nLABEL org.jvedio.mirror=%s\n' "$IMAGE" "$TAG" "$TAG" > /tmp/Dockerfile.mirror
          docker build -f /tmp/Dockerfile.mirror -t "$IMAGE:$TAG" .

      - name: Push version and latest
        run: |
          set -euo pipefail
          docker push "$IMAGE:$TAG"
          docker tag "$IMAGE:$TAG" "$IMAGE:latest"
          docker push "$IMAGE:latest"

      - name: Record digest
        run: |
          digest=$(docker image inspect "$IMAGE:$TAG" --format '{{index .RepoDigests 0}}' | cut -d@ -f2)
          printf '{"tag":"%s","digest":"%s"}\n' "$TAG" "$digest" > mirror-receipt.json
          cat mirror-receipt.json

      - uses: actions/upload-artifact@v4
        with:
          name: mirror-receipt
          path: mirror-receipt.json
          retention-days: 30
