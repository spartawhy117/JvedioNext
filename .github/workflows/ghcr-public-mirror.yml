name: GHCR Public Mirror

# 手动兜底：把已发布的镜像从公开仓再推一次。
#
# 注意：这不是包归属的主路径。包的仓库链接是 package 对象上的独立属性，
# 已建包的链接不会因为「另一个仓又推了一次」而改变——改 OCI source 标签、
# 复推同 digest、派生新 digest 三种做法都已实测无效（见
# doc/operations/dual-repo-docker-image-release.md §8）。
# 真正的迁移路径是包设置页 Unlink → Connect repository，一次性人工操作。
# 本工作流仅保留手动触发，用于镜像内容需要从公开仓侧重新落一次时救急。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签（如 12.1.1）'
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-public-mirror-${{ inputs.tag }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/spartawhy117/jvedionext

jobs:
  mirror:
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          raw="$INPUT_TAG"
          tag="${raw#v}"
          if ! printf '%s' "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Unsupported tag '$raw'"
            exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image with mirror label
        run: |
          set -euo pipefail
          # 直接复推同一 digest 不会被登记为「本仓发布」；派生一层改变 digest。
          printf 'FROM %s:%s\nLABEL org.jvedio.mirror=%s\n' "$IMAGE" "$TAG" "$TAG" > /tmp/Dockerfile.mirror
          docker build -f /tmp/Dockerfile.mirror -t "$IMAGE:$TAG" .

      - name: Push version and latest
        run: |
          set -euo pipefail
          docker push "$IMAGE:$TAG"
          docker tag "$IMAGE:$TAG" "$IMAGE:latest"
          docker push "$IMAGE:latest"

      - name: Record digest
        run: |
          digest=$(docker image inspect "$IMAGE:$TAG" --format '{{index .RepoDigests 0}}' | cut -d@ -f2)
          printf '{"tag":"%s","digest":"%s"}\n' "$TAG" "$digest" > mirror-receipt.json
          cat mirror-receipt.json

      - uses: actions/upload-artifact@v4
        with:
          name: mirror-receipt
          path: mirror-receipt.json
          retention-days: 30
