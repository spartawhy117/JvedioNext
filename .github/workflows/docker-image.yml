name: Docker image validation
on:
  workflow_dispatch:
    inputs:
      publish_candidate:
        description: Push a private candidate and verify its digest on a fresh Linux runner
        type: boolean
        default: false
  push:
    branches: [docker-support]
    paths:
      - 'dotnet/**'
      - 'tauri/**'
      - 'deployment/docker/**'
      - 'scripts/**'
      - 'tests/runners/**'
      - 'tests/shared/scripts/**'
      - '.github/workflows/docker-image.yml'
  pull_request:
    paths:
      - 'dotnet/**'
      - 'tauri/**'
      - 'deployment/docker/**'
      - '.dockerignore'
      - 'scripts/build-docker.ps1'
      - 'scripts/get-docker-source-fingerprint.ps1'
      - 'scripts/run-tests.ps1'
      - 'scripts/run-docker-tests.ps1'
      - 'tests/runners/run-product-suite.ps1'
      - 'tests/shared/scripts/product-suite.ps1'
      - 'tests/baseline-packs/docker-runtime/**'
      - 'tests/e2e-packs/docker-web/setup.ps1'
      - '.github/workflows/docker-image.yml'
permissions:
  contents: read
concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime and execute native contracts
        shell: pwsh
        run: ./scripts/build-docker.ps1 -Target runtime -Image jvedio:ci
      - name: Verify runtime contents
        run: |
          docker run --rm --network none --entrypoint sh jvedio:ci -ec '
            test "$(id -u)" = 1000
            test -f /app/wwwroot/index.html
            test ! -d /usr/share/dotnet/sdk
            test ! -d /app/node_modules
            test ! -d /app/test-data
            test ! -d /app/tests
            test ! -d /app/auth
            ffmpeg -version >/dev/null
            ffprobe -version >/dev/null'
      - name: Export validated candidate
        if: (github.event_name == 'workflow_dispatch' && inputs.publish_candidate && (github.ref_name == 'docker-support' || github.ref_name == 'master')) || (github.event_name == 'push' && github.ref_name == 'docker-support' && contains(github.event.head_commit.message, '[candidate-ci]'))
        run: docker save jvedio:ci | gzip > candidate-image.tar.gz
      - uses: actions/upload-artifact@v4
        if: (github.event_name == 'workflow_dispatch' && inputs.publish_candidate && (github.ref_name == 'docker-support' || github.ref_name == 'master')) || (github.event_name == 'push' && github.ref_name == 'docker-support' && contains(github.event.head_commit.message, '[candidate-ci]'))
        with:
          name: candidate-image
          path: candidate-image.tar.gz
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-build-receipts
          path: temp/docker-build/
          retention-days: 7
  publish-candidate:
    if: (github.event_name == 'workflow_dispatch' && inputs.publish_candidate && (github.ref_name == 'docker-support' || github.ref_name == 'master')) || (github.event_name == 'push' && github.ref_name == 'docker-support' && contains(github.event.head_commit.message, '[candidate-ci]'))
    needs: linux-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: candidate-image
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish private candidate
        id: publish
        env:
          REVISION: ${{ github.sha }}
          CANDIDATE_IMAGE: ghcr.io/spartawhy117/jvedionext-private
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gunzip -c candidate-image.tar.gz | docker load
          tag="$CANDIDATE_IMAGE:candidate-$REVISION"
          docker tag jvedio:ci "$tag"
          docker push "$tag"
          visibility=$(gh api /users/spartawhy117/packages/container/jvedionext-private --jq .visibility)
          test "$visibility" = private
          digest=$(docker image inspect "$tag" --format '{{index .RepoDigests 0}}' | cut -d@ -f2)
          test "${digest#sha256:}" != "$digest"
          echo "image=$CANDIDATE_IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf '{"revision":"%s","image":"%s","digest":"%s","visibility":"%s"}\n' "$REVISION" "$CANDIDATE_IMAGE" "$digest" "$visibility" > candidate-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-receipt
          path: candidate-receipt.json
          retention-days: 30
  pull-and-run:
    needs: publish-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tauri/package-lock.json
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull exact candidate digest
        env:
          IMAGE: ${{ needs.publish-candidate.outputs.image }}
          DIGEST: ${{ needs.publish-candidate.outputs.digest }}
        run: docker pull "$IMAGE@$DIGEST"
      - name: Install API test client
        working-directory: tauri
        run: npm ci --no-audit
      - name: Provision isolated synthetic staging volume
        run: |
          mkdir -p temp/product-tests
          sudo mount -t tmpfs -o size=14G,mode=1777 tmpfs "$PWD/temp/product-tests"
          df -h "$PWD/temp/product-tests"
      - name: Execute existing isolated Linux baseline against pulled image
        shell: pwsh
        env:
          IMAGE: ${{ needs.publish-candidate.outputs.image }}
          DIGEST: ${{ needs.publish-candidate.outputs.digest }}
        run: ./scripts/run-tests.ps1 -Target docker-release -Mode baseline -DockerImage "$env:IMAGE@$env:DIGEST" -NoBuild -NoPause
      - name: Collect nonsecret runtime evidence
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force temp/candidate-verification | Out-Null
          Copy-Item tests/latest-summary.json,tests/baseline-durations.json temp/candidate-verification/ -ErrorAction Continue
          Get-ChildItem temp/product-tests -Recurse -Filter '*contracts.json' -ErrorAction SilentlyContinue | Copy-Item -Destination temp/candidate-verification/
          Get-ChildItem temp/product-tests -Recurse -Filter 'fixture.log' -ErrorAction SilentlyContinue | ForEach-Object {
            Get-Content -LiteralPath $_.FullName
            Copy-Item -LiteralPath $_.FullName -Destination temp/candidate-verification/
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-runtime-verification
          path: |
            temp/candidate-verification/
            log/test/product/runs/
          retention-days: 30
